<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur de photo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #1e1e2e;
    color: #cdd6f4;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* TOOLBAR */
  #toolbar {
    background: #181825;
    border-bottom: 1px solid #313244;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .tool-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 0 6px;
    border-right: 1px solid #313244;
  }
  .tool-group:last-child { border-right: none; }

  .tool-btn {
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 6px 10px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tool-btn:hover { background: #45475a; border-color: #89b4fa; }
  .tool-btn.active { background: #89b4fa; color: #1e1e2e; border-color: #89b4fa; font-weight: 600; }
  .tool-btn.danger:hover { background: #f38ba8; border-color: #f38ba8; color: #1e1e2e; }
  .tool-btn.success { background: #a6e3a1; color: #1e1e2e; border-color: #a6e3a1; font-weight: 600; }
  .tool-btn.success:hover { background: #94d494; border-color: #94d494; }
  .tool-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  #colorPicker {
    width: 32px; height: 32px;
    border: 2px solid #45475a;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px;
    background: #313244;
  }

  select {
    background: #313244;
    border: 1px solid #45475a;
    color: #cdd6f4;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 13px;
    cursor: pointer;
  }
  select:hover { border-color: #89b4fa; }

  /* CANVAS AREA */
  #canvas-container {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #181825;
    padding: 16px;
  }

  /* Placeholder quand aucune image */
  #placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    color: #6c7086;
    text-align: center;
  }
  #placeholder svg { opacity: 0.3; }
  #placeholder p { font-size: 15px; }
  #placeholder .open-hint {
    background: #313244;
    border: 1px dashed #45475a;
    border-radius: 12px;
    padding: 32px 48px;
    cursor: pointer;
    transition: all 0.2s;
  }
  #placeholder .open-hint:hover {
    border-color: #89b4fa;
    color: #89b4fa;
    background: #1e2a3a;
  }

  #canvas-wrapper {
    position: relative;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    display: none;
  }

  canvas { display: block; }

  /* BOTTOM BAR */
  #bottombar {
    background: #181825;
    border-top: 1px solid #313244;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  #status { font-size: 12px; color: #6c7086; }
  #fileName { font-size: 12px; color: #a6adc8; max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Crop overlay */
  #cropOverlay {
    display: none;
    position: absolute;
    top: 0; left: 0;
    background: rgba(0,0,0,0.5);
    width: 100%; height: 100%;
    cursor: crosshair;
    z-index: 10;
  }
  #cropRect {
    position: absolute;
    border: 2px dashed #89b4fa;
    background: rgba(137,180,250,0.1);
    pointer-events: none;
  }

  /* Toast notification */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #313244;
    color: #cdd6f4;
    border: 1px solid #45475a;
    border-radius: 10px;
    padding: 12px 24px;
    font-size: 14px;
    font-weight: 600;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 200;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.success { background: #1e3a2f; border-color: #a6e3a1; color: #a6e3a1; }
  #toast.error { background: #3a1e1e; border-color: #f38ba8; color: #f38ba8; }

  /* Input file caché */
  #fileInput { display: none; }
</style>
</head>
<body>

<!-- Input fichier caché -->
<input type="file" id="fileInput" accept="image/*" onchange="handleFileOpen(event)">

<!-- Toast -->
<div id="toast"></div>

<!-- Toolbar -->
<div id="toolbar">

  <div class="tool-group">
    <button class="tool-btn success" onclick="document.getElementById('fileInput').click()" title="Ouvrir une image depuis le disque">📂 Ouvrir</button>
  </div>

  <div class="tool-group">
    <span style="font-size:12px;color:#6c7086;margin-right:4px;">Sélection</span>
    <button class="tool-btn active" id="btn-select" onclick="setTool('select')" title="Sélectionner/déplacer">↖ Sélect.</button>
    <button class="tool-btn danger" id="btn-delete" onclick="deleteSelected()" title="Supprimer l'élément sélectionné">🗑 Suppr.</button>
  </div>

  <div class="tool-group">
    <span style="font-size:12px;color:#6c7086;margin-right:4px;">Formes</span>
    <button class="tool-btn" id="btn-arrow" onclick="setTool('arrow')" title="Flèche">→ Flèche</button>
    <button class="tool-btn" id="btn-rect" onclick="setTool('rect')" title="Rectangle">▭ Rect.</button>
    <button class="tool-btn" id="btn-circle" onclick="setTool('circle')" title="Cercle">○ Cercle</button>
    <button class="tool-btn" id="btn-line" onclick="setTool('line')" title="Ligne">╱ Ligne</button>
  </div>

  <div class="tool-group">
    <span style="font-size:12px;color:#6c7086;margin-right:4px;">Texte</span>
    <button class="tool-btn" id="btn-text" onclick="setTool('text')" title="Ajouter du texte">T Texte</button>
  </div>

  <div class="tool-group">
    <span style="font-size:12px;color:#6c7086;margin-right:4px;">Image</span>
    <button class="tool-btn" id="btn-crop" onclick="startCrop()" title="Rogner la photo">✂ Rogner</button>
    <button class="tool-btn" onclick="flipH()" title="Miroir horizontal">↔ Flip H</button>
    <button class="tool-btn" onclick="flipV()" title="Miroir vertical">↕ Flip V</button>
    <button class="tool-btn" onclick="rotateImg(90)" title="Rotation 90°">↻ 90°</button>
  </div>

  <div class="tool-group">
    <label for="colorPicker" style="font-size:12px;color:#a6adc8;">Couleur</label>
    <input type="color" id="colorPicker" value="#ff0000" onchange="updateColor(this.value)">
  </div>

  <div class="tool-group">
    <label style="font-size:12px;color:#a6adc8;">Épaisseur</label>
    <select id="strokeWidth" onchange="updateStroke(this.value)">
      <option value="2">2px</option>
      <option value="4" selected>4px</option>
      <option value="6">6px</option>
      <option value="10">10px</option>
    </select>
  </div>

  <div class="tool-group">
    <button class="tool-btn" onclick="undo()" title="Annuler">↩ Annuler</button>
    <button class="tool-btn danger" onclick="clearAnnotations()" title="Effacer toutes les annotations">🗑 Tout effacer</button>
  </div>

</div>

<!-- Canvas -->
<div id="canvas-container">

  <!-- Placeholder affiché quand aucune image n'est chargée -->
  <div id="placeholder">
    <div class="open-hint" onclick="document.getElementById('fileInput').click()">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      <p style="margin-top:12px;font-size:16px;">Cliquez ici pour ouvrir une image</p>
      <p style="margin-top:6px;font-size:12px;opacity:0.6;">JPG, PNG, GIF, WebP…</p>
    </div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="mainCanvas"></canvas>
    <div id="cropOverlay">
      <div id="cropRect"></div>
    </div>
  </div>
</div>

<!-- Bottom bar -->
<div id="bottombar">
  <div style="display:flex;gap:16px;align-items:center;">
    <span id="status">Aucune image chargée</span>
    <span id="fileName"></span>
  </div>
  <button class="tool-btn success" id="btnSave" onclick="saveImage()" style="padding:8px 20px;font-size:14px;" title="Sauvegarder l'image annotée sur le disque">💾 Sauvegarder</button>
</div>

<script>
  let canvas, bgImage, currentTool = 'select';
  let isDrawing = false, startX, startY, activeShape;
  let history = [];
  let currentColor = '#ff0000';
  let currentStroke = 4;
  let openedFileName = '';

  // ─── INIT ────────────────────────────────────────────────────────────────────
  window.onload = function() {
    canvas = new fabric.Canvas('mainCanvas', {
      selection: true,
      preserveObjectStacking: true
    });
    setupCanvasEvents();
  };

  // ─── OUVRIR IMAGE DEPUIS LE DISQUE ──────────────────────────────────────────
  function handleFileOpen(event) {
    const file = event.target.files[0];
    if (!file) return;

    openedFileName = file.name;
    document.getElementById('fileName').textContent = '📄 ' + file.name;

    const reader = new FileReader();
    reader.onload = function(e) {
      loadPhotoFromDataURL(e.target.result);
    };
    reader.readAsDataURL(file);

    // Reset input pour permettre de rouvrir le même fichier
    event.target.value = '';
  }

  function loadPhotoFromDataURL(dataURL) {
    fabric.Image.fromURL(dataURL, function(img) {
      if (!img || !img.width) {
        showToast('Impossible de charger la photo', 'error');
        return;
      }

      const maxW = window.innerWidth - 64;
      const maxH = window.innerHeight - 160;
      const scale = Math.min(maxW / img.width, maxH / img.height, 1);

      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);

      canvas.clear();
      canvas.setWidth(w);
      canvas.setHeight(h);

      img.set({ scaleX: scale, scaleY: scale, left: 0, top: 0,
                selectable: false, evented: false,
                originX: 'left', originY: 'top' });
      canvas.add(img);
      canvas.sendToBack(img);
      bgImage = img;

      // Afficher le canvas, cacher le placeholder
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('canvas-wrapper').style.display = 'block';

      saveHistory();
      setTool('select');
      showToast('✅ Image chargée !', 'success');
    });
  }

  // ─── TOOL MANAGEMENT ────────────────────────────────────────────────────────
  function setTool(tool) {
    currentTool = tool;
    canvas.isDrawingMode = false;
    canvas.selection = (tool === 'select');
    canvas.forEachObject(o => { if (o !== bgImage) o.selectable = (tool === 'select'); });

    document.querySelectorAll('.tool-btn[id^="btn-"]').forEach(b => b.classList.remove('active'));
    const btn = document.getElementById('btn-' + tool);
    if (btn) btn.classList.add('active');

    const labels = { select:'Sélection', arrow:'Flèche', rect:'Rectangle', circle:'Cercle', line:'Ligne', text:'Texte', crop:'Rogner' };
    document.getElementById('status').textContent = 'Outil actif : ' + (labels[tool] || tool);

    canvas.defaultCursor = (tool === 'select') ? 'default' : 'crosshair';
    canvas.renderAll();
  }

  // ─── CANVAS MOUSE EVENTS ────────────────────────────────────────────────────
  function setupCanvasEvents() {
    canvas.on('mouse:down', onMouseDown);
    canvas.on('mouse:move', onMouseMove);
    canvas.on('mouse:up', onMouseUp);
  }

  function onMouseDown(opt) {
    if (currentTool === 'select') return;
    if (currentTool === 'text') { addText(opt); return; }

    isDrawing = true;
    const p = canvas.getPointer(opt.e);
    startX = p.x; startY = p.y;

    if (currentTool === 'rect') {
      activeShape = new fabric.Rect({
        left: startX, top: startY, width: 0, height: 0,
        fill: 'transparent', stroke: currentColor, strokeWidth: currentStroke,
        selectable: false
      });
    } else if (currentTool === 'circle') {
      activeShape = new fabric.Ellipse({
        left: startX, top: startY, rx: 0, ry: 0,
        fill: 'transparent', stroke: currentColor, strokeWidth: currentStroke,
        selectable: false
      });
    } else if (currentTool === 'line') {
      activeShape = new fabric.Line([startX, startY, startX, startY], {
        stroke: currentColor, strokeWidth: currentStroke,
        selectable: false
      });
    } else if (currentTool === 'arrow') {
      activeShape = new fabric.Line([startX, startY, startX, startY], {
        stroke: currentColor, strokeWidth: currentStroke,
        selectable: false, _isArrowLine: true
      });
    }

    if (activeShape) canvas.add(activeShape);
  }

  function onMouseMove(opt) {
    if (!isDrawing || !activeShape) return;
    const p = canvas.getPointer(opt.e);

    if (currentTool === 'rect') {
      const w = p.x - startX, h = p.y - startY;
      activeShape.set({ width: Math.abs(w), height: Math.abs(h), left: w < 0 ? p.x : startX, top: h < 0 ? p.y : startY });
    } else if (currentTool === 'circle') {
      const rx = Math.abs(p.x - startX) / 2, ry = Math.abs(p.y - startY) / 2;
      activeShape.set({ rx, ry, left: Math.min(p.x, startX), top: Math.min(p.y, startY) });
    } else if (currentTool === 'line' || currentTool === 'arrow') {
      activeShape.set({ x2: p.x, y2: p.y });
    }

    canvas.renderAll();
  }

  function onMouseUp(opt) {
    if (!isDrawing) return;
    isDrawing = false;

    if (activeShape) {
      if (currentTool === 'arrow') addArrowHead(activeShape);
      activeShape.set({ selectable: true });
      activeShape = null;
      saveHistory();
    }
  }

  // ─── ARROW HEAD ─────────────────────────────────────────────────────────────
  function addArrowHead(line) {
    const x1 = line.x1 + line.left, y1 = line.y1 + line.top;
    const x2 = line.x2 + line.left, y2 = line.y2 + line.top;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const size = Math.max(currentStroke * 4, 14);

    const arrowHead = new fabric.Triangle({
      left: x2, top: y2,
      originX: 'center', originY: 'center',
      angle: (angle * 180 / Math.PI) + 90,
      width: size, height: size,
      fill: currentColor, stroke: currentColor,
      selectable: true
    });

    canvas.add(arrowHead);
    canvas.remove(line);
    const group = new fabric.Group([
      new fabric.Line([x1, y1, x2, y2], { stroke: currentColor, strokeWidth: currentStroke }),
      arrowHead
    ], { selectable: true });
    canvas.add(group);
  }

  // ─── TEXT ────────────────────────────────────────────────────────────────────
  function addText(opt) {
    const p = canvas.getPointer(opt.e);
    const text = new fabric.IText('Texte ici', {
      left: p.x, top: p.y,
      fontSize: 20, fill: currentColor,
      fontFamily: 'Segoe UI',
      backgroundColor: 'rgba(0,0,0,0.4)',
      padding: 4,
      selectable: true
    });
    canvas.add(text);
    canvas.setActiveObject(text);
    text.enterEditing();
    saveHistory();
  }

  // ─── IMAGE OPERATIONS ────────────────────────────────────────────────────────
  function flipH() {
    if (!bgImage) return;
    bgImage.set('flipX', !bgImage.flipX);
    canvas.renderAll();
    saveHistory();
  }

  function flipV() {
    if (!bgImage) return;
    bgImage.set('flipY', !bgImage.flipY);
    canvas.renderAll();
    saveHistory();
  }

  function rotateImg(deg) {
    if (!bgImage) return;
    const currentAngle = bgImage.angle || 0;
    bgImage.set({ angle: currentAngle + deg, originX: 'center', originY: 'center', left: canvas.width/2, top: canvas.height/2 });
    const w = canvas.width, h = canvas.height;
    canvas.setWidth(h);
    canvas.setHeight(w);
    bgImage.set({ scaleX: bgImage.scaleY, scaleY: bgImage.scaleX });
    canvas.renderAll();
    saveHistory();
  }

  // ─── CROP ────────────────────────────────────────────────────────────────────
  let cropStartX, cropStartY, cropEndX, cropEndY;
  let isCropping = false;

  function startCrop() {
    if (!bgImage) { showToast('Ouvrez d\'abord une image', 'error'); return; }
    setTool('crop');
    const overlay = document.getElementById('cropOverlay');
    const cropRect = document.getElementById('cropRect');
    overlay.style.display = 'block';

    overlay.onmousedown = (e) => {
      isCropping = true;
      const rect = overlay.getBoundingClientRect();
      cropStartX = e.clientX - rect.left;
      cropStartY = e.clientY - rect.top;
      cropRect.style.left = cropStartX + 'px';
      cropRect.style.top = cropStartY + 'px';
      cropRect.style.width = '0';
      cropRect.style.height = '0';
    };

    overlay.onmousemove = (e) => {
      if (!isCropping) return;
      const rect = overlay.getBoundingClientRect();
      cropEndX = e.clientX - rect.left;
      cropEndY = e.clientY - rect.top;
      const x = Math.min(cropStartX, cropEndX);
      const y = Math.min(cropStartY, cropEndY);
      const w = Math.abs(cropEndX - cropStartX);
      const h = Math.abs(cropEndY - cropStartY);
      cropRect.style.left = x + 'px';
      cropRect.style.top = y + 'px';
      cropRect.style.width = w + 'px';
      cropRect.style.height = h + 'px';
    };

    overlay.onmouseup = () => {
      isCropping = false;
      overlay.style.display = 'none';
      cropRect.style.width = '0';
      cropRect.style.height = '0';
      applyCrop();
    };
  }

  function applyCrop() {
    const x = Math.min(cropStartX, cropEndX);
    const y = Math.min(cropStartY, cropEndY);
    const w = Math.abs(cropEndX - cropStartX);
    const h = Math.abs(cropEndY - cropStartY);
    if (w < 10 || h < 10) { setTool('select'); return; }

    const dataURL = canvas.toDataURL({ left: x, top: y, width: w, height: h, format: 'png' });

    fabric.Image.fromURL(dataURL, function(img) {
      canvas.clear();
      canvas.setWidth(w);
      canvas.setHeight(h);
      img.set({ left: 0, top: 0, selectable: false, evented: false });
      canvas.add(img);
      canvas.sendToBack(img);
      bgImage = img;
      canvas.renderAll();
      saveHistory();
    });

    setTool('select');
  }

  // ─── COLOR & STROKE ─────────────────────────────────────────────────────────
  function updateColor(val) {
    currentColor = val;
    const obj = canvas.getActiveObject();
    if (obj) {
      if (obj.type === 'i-text' || obj.type === 'text') obj.set('fill', val);
      else { obj.set('stroke', val); if (obj.type === 'triangle') obj.set('fill', val); }
      canvas.renderAll();
    }
  }

  function updateStroke(val) {
    currentStroke = parseInt(val);
    const obj = canvas.getActiveObject();
    if (obj && obj.strokeWidth !== undefined) {
      obj.set('strokeWidth', currentStroke);
      canvas.renderAll();
    }
  }

  // ─── DELETE ──────────────────────────────────────────────────────────────────
  function deleteSelected() {
    const obj = canvas.getActiveObject();
    if (obj && obj !== bgImage) {
      canvas.remove(obj);
      canvas.renderAll();
      saveHistory();
    }
  }

  function clearAnnotations() {
    if (!bgImage) return;
    if (!confirm('Effacer toutes les annotations?')) return;
    canvas.getObjects().forEach(o => { if (o !== bgImage) canvas.remove(o); });
    canvas.renderAll();
    saveHistory();
  }

  // ─── HISTORY (undo) ──────────────────────────────────────────────────────────
  function saveHistory() {
    history.push(JSON.stringify(canvas.toJSON(['selectable','evented','_isArrowLine'])));
    if (history.length > 20) history.shift();
  }

  function undo() {
    if (history.length <= 1) return;
    history.pop();
    const prev = history[history.length - 1];
    canvas.loadFromJSON(prev, () => {
      canvas.getObjects().forEach(o => {
        if (!o.selectable) { o.evented = false; bgImage = o; }
      });
      canvas.renderAll();
    });
  }

  // ─── KEYBOARD SHORTCUTS ──────────────────────────────────────────────────────
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Delete' || e.key === 'Backspace') {
      const active = canvas.getActiveObject();
      if (active && active.type !== 'i-text') deleteSelected();
    }
    if (e.ctrlKey && e.key === 'z') undo();
  });

  // ─── TOAST ──────────────────────────────────────────────────────────────────
  function showToast(message, type = '') {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = 'show ' + type;
    setTimeout(() => { toast.className = ''; }, 3500);
  }

  // ─── SAUVEGARDER SUR LE DISQUE ───────────────────────────────────────────────
  function saveImage() {
    if (!bgImage) {
      showToast('Ouvrez d\'abord une image', 'error');
      return;
    }

    // Désélectionner avant export
    canvas.discardActiveObject();
    canvas.renderAll();

    // Générer un nom de fichier basé sur l'original
    const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
    const baseName = openedFileName
      ? openedFileName.replace(/\.[^/.]+$/, '') + '_annote_' + ts + '.png'
      : 'photo_annotee_' + ts + '.png';

    // Exporter en PNG et déclencher le téléchargement
    const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });

    const a = document.createElement('a');
    a.href = dataURL;
    a.download = baseName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    showToast('✅ Image sauvegardée : ' + baseName, 'success');
  }
</script>
</body>
</html>
